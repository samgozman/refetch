name: Release

# On every push to main, release-please keeps a release PR up to date from
# the conventional commits. Merging that PR tags vX.Y.Z and creates the
# GitHub release; the same run then builds the binaries into it and, last,
# commits the new version and checksums onto the tag and pushes that to the
# `release` branch, which is what the marketplace installs. Tags and pushes
# made with GITHUB_TOKEN start no other workflow, so all three steps live in
# this one.
on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The latest patch release, so builds get the standard library's fixes;
  # go.mod's `go` line is only the minimum.
  GO_VERSION: 1.27.x

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write # release-please labels its PRs
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  binaries:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false # GoReleaser takes the token from env
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: false # no cache restored into a job that can write releases
      - name: Test
        run: make test
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt

  # The release branch is the plugin users install, so it moves only after
  # the binaries it points at are published, and only to this tag plus the
  # version commit: nothing merged after the tag ships with it.
  plugin-version:
    needs: [release-please, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - name: Write the version and checksums into the plugin
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --pattern '*.tar.gz' --dir "$RUNNER_TEMP/release"
          scripts/plugin-version.sh "$VERSION" "$RUNNER_TEMP/release"
          git diff --stat
      - name: Commit and push to the release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: plugin v$VERSION"
          git push --force origin HEAD:refs/heads/release
