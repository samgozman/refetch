name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The latest patch release, so builds get the standard library's fixes;
  # go.mod's `go` line is only the minimum.
  GO_VERSION: 1.27.x
  # Keep in sync with `version` in .custom-gcl.yml.
  GOLANGCI_LINT_VERSION: v2.15.0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Build
        run: make build
      - name: Test (fails below the coverage minimum)
        run: make cover-check
      # Fork PRs get no secrets; the action then uploads without a token,
      # which Codecov accepts for public repositories.
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: THIRD_PARTY_NOTICES is current
        run: |
          make notices
          git diff --exit-code THIRD_PARTY_NOTICES

  plugin:
    name: Plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned so a new validator rule cannot fail an unrelated PR; bump it
      # on purpose.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.308
      - name: Validate
        run: claude plugin validate . --strict

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  lint:
    name: Lint (golangci-lint + maxcomments)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      # .golangci.yml enables the maxcomments module plugin, so lint with a
      # golangci-lint binary that has it compiled in: install upstream, build
      # build/custom-gcl from .custom-gcl.yml, then run that.
      - name: Install golangci-lint
        run: |
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_LINT_VERSION}/install.sh" \
            | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"
      - name: Build the custom binary
        run: make lint-build
      - name: Lint
        run: make lint
