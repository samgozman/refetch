name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` starts the approval-gated macOS run (see test-macos).
    types: [opened, synchronize, reopened, labeled]
  # Manual runs (Actions → CI → Run workflow) test macOS only.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in sync with `version` in .custom-gcl.yml.
  GOLANGCI_LINT_VERSION: v2.15.0

concurrency:
  # macOS runs have their own group so a new push does not cancel them.
  group: ci-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || github.event.action == 'labeled') && 'macos' || 'main' }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Linux)
    if: github.event_name != 'workflow_dispatch' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Build
        run: make build
      - name: Test (fails below the coverage minimum)
        run: make cover-check
      - name: Keep the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
      - name: THIRD_PARTY_NOTICES is current
        run: |
          make notices
          git diff --exit-code THIRD_PARTY_NOTICES

  # macOS minutes cost about ten times Linux minutes, so every run needs an
  # explicit approval: Run workflow in the Actions tab, or the `ci:macos`
  # label on a PR (removed after the run, so the next one needs it again).
  test-macos:
    name: Test (macOS)
    if: github.event_name == 'workflow_dispatch' || (github.event.action == 'labeled' && github.event.label.name == 'ci:macos')
    runs-on: macos-latest
    permissions:
      contents: read
      pull-requests: write # to remove the label
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Remove the approval label
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ci:macos

  plugin:
    name: Plugin validate
    if: github.event_name != 'workflow_dispatch' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned so a new validator rule cannot fail an unrelated PR; bump it
      # on purpose.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.308
      - name: Validate
        run: claude plugin validate . --strict

  lint:
    name: Lint (golangci-lint + maxcomments)
    if: github.event_name != 'workflow_dispatch' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # .golangci.yml enables the maxcomments module plugin, so lint with a
      # golangci-lint binary that has it compiled in: install upstream, build
      # build/custom-gcl from .custom-gcl.yml, then run that.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      - name: Build the custom binary
        run: make lint-build
      - name: Lint
        run: make lint
