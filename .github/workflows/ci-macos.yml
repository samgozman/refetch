name: CI (macOS)

# A workflow of its own, so starting it never adds skipped entries for the
# required Linux checks to a pull request.
on:
  pull_request:
    types: [labeled]
  # Actions → CI (macOS) → Run workflow.
  workflow_dispatch:

permissions:
  contents: read

env:
  # The latest patch release, as in ci.yml.
  GO_VERSION: 1.27.x

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS minutes cost about ten times Linux minutes, so every run needs an
  # explicit approval: Run workflow in the Actions tab, or the `ci:macos`
  # label on a PR (removed after the run, so the next one needs it again).
  test-macos:
    name: Test (macOS)
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ci:macos'
    runs-on: macos-latest
    permissions:
      contents: read
      pull-requests: write # to remove the label
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Build
        run: make build
      - name: Test
        run: make test
      # A fork's token cannot edit labels; a maintainer removes it there.
      - name: Remove the approval label
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ci:macos
